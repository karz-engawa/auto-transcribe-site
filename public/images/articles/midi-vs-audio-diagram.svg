<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f9fafb" rx="12"/>
  <text x="400" y="48" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#374151" font-weight="bold">音声ファイル vs MIDIファイル</text>

  <!-- Left panel: Audio -->
  <rect x="40" y="68" width="340" height="300" rx="10" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <text x="210" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#374151" font-weight="bold">MP3 / WAV（音声ファイル）</text>

  <!-- Waveform -->
  <polyline
    points="60,205 85,162 110,228 135,145 160,215 185,172 210,235 235,155 260,205 285,168 310,220 335,158 360,205 380,180"
    stroke="#6366f1" stroke-width="2.5" fill="none"/>

  <text x="210" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">録音された音の波形データ</text>
  <text x="210" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">音そのものを保存</text>

  <!-- Right panel: MIDI piano roll -->
  <rect x="420" y="68" width="340" height="300" rx="10" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <text x="590" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#374151" font-weight="bold">MIDI（演奏情報）</text>

  <!-- Piano roll bars -->
  <rect x="450" y="130" width="90" height="20" rx="3" fill="#3b82f6"/>
  <rect x="555" y="115" width="65" height="20" rx="3" fill="#3b82f6"/>
  <rect x="635" y="145" width="100" height="20" rx="3" fill="#3b82f6"/>
  <rect x="450" y="178" width="55" height="20" rx="3" fill="#60a5fa"/>
  <rect x="520" y="163" width="75" height="20" rx="3" fill="#60a5fa"/>
  <rect x="610" y="180" width="95" height="20" rx="3" fill="#60a5fa"/>
  <rect x="450" y="225" width="80" height="20" rx="3" fill="#93c5fd"/>
  <rect x="545" y="210" width="60" height="20" rx="3" fill="#93c5fd"/>

  <text x="590" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">音符・タイミング・強さの情報</text>
  <text x="590" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">演奏指示を保存</text>

  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9ca3af">※ 実際の図に差し替え予定</text>
</svg>
