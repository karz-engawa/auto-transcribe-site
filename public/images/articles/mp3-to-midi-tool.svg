<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f9fafb" rx="12"/>

  <!-- Card -->
  <rect x="100" y="50" width="600" height="320" rx="12" fill="white" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Upload area -->
  <rect x="140" y="90" width="520" height="170" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Upload icon -->
  <circle cx="400" cy="155" r="30" fill="#dbeafe"/>
  <line x1="400" y1="141" x2="400" y2="169" stroke="#3b82f6" stroke-width="3.5"/>
  <line x1="386" y1="155" x2="414" y2="155" stroke="#3b82f6" stroke-width="3.5"/>

  <text x="400" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#3b82f6" font-weight="bold">音声ファイルをアップロード</text>
  <text x="400" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9ca3af">MP3・WAVをドラッグ＆ドロップ、またはクリックして選択</text>

  <!-- Button -->
  <rect x="290" y="295" width="220" height="46" rx="8" fill="#2563eb"/>
  <text x="400" y="324" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white" font-weight="bold">MIDIを生成する</text>

  <text x="400" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9ca3af">※ 実際のスクリーンショットに差し替え予定</text>
</svg>
